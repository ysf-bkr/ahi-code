name: Bug report
description: Report a reproducible defect in AhiCode.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** use this form for security
        problems; see [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace with ...
        2. Send the prompt "..."
        3. Approve the spec
        4. See the error
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: AhiCode version
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: 1.106.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Remote / container / Codespaces
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      options:
        - OpenRouter
        - Ollama (local)
        - OpenAI-compatible endpoint
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output channel log
      description: |
        Copy the relevant lines from **Output → AhiCode**. Remove API keys,
        tokens, prompts, and file contents before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I am not reporting a security vulnerability (those go to SECURITY.md).
          required: true
        - label: I removed secrets and private code from the logs I pasted.
          required: true

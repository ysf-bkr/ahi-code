<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024" fill="none">
  <!-- AhiCode: Ahilik şed kuşağı, çağrı grafiği düğümleri ve stilize "A" harfi -->
  <defs>
    <!-- Çini mavisi & Selçuklu turkuazı kuşak gradyanı -->
    <linearGradient id="ahi-sash-left" x1="15" y1="87" x2="50" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ahi-sash-right" x1="50" y1="11" x2="85" y2="87" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ahi-knot" x1="20" y1="59" x2="80" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <!-- Ahilik zanaat altını / bakır gradyanı -->
    <linearGradient id="ahi-gold" x1="41" y1="50" x2="59" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ahi-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Koyu çini gecesi arka plan gradyanı (tam kenardan kenara) -->
    <radialGradient id="ahi-bg" cx="50" cy="50" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="70%" stop-color="#081528"/>
      <stop offset="100%" stop-color="#040b14"/>
    </radialGradient>
    <filter id="ahi-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#00e5ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Tam kenara sıfır çini mavisi zarif squircle zemin -->
  <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#ahi-bg)" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Şed Kuşağı / A Harfi Sol Bacak -->
  <path d="M 15 87 C 15 54, 35 22, 50 11" stroke="url(#ahi-sash-left)" stroke-width="10" stroke-linecap="round" filter="url(#ahi-glow)"/>

  <!-- Şed Kuşağı / A Harfi Sağ Bacak -->
  <path d="M 50 11 C 65 22, 85 54, 85 87" stroke="url(#ahi-sash-right)" stroke-width="10" stroke-linecap="round" filter="url(#ahi-glow)"/>

  <!-- Şed Kuşağı Düğümü / A Yatay Bağı (Kıvrımlı bağ) -->
  <path d="M 21 59 C 33 53, 41 65, 50 59 C 59 53, 67 65, 79 59" stroke="url(#ahi-knot)" stroke-width="8" stroke-linecap="round"/>

  <!-- Merkezi Şed Düğümü (Çağrı Grafiği Merkezi Hub) -->
  <circle cx="50" cy="59" r="9.5" fill="#040b14" stroke="url(#ahi-gold)" stroke-width="3"/>
  <circle cx="50" cy="59" r="4" fill="url(#ahi-gold)"/>

  <!-- Tepe Düğümü (Usta / Pir / Kök) -->
  <circle cx="50" cy="11" r="8" fill="#040b14" stroke="url(#ahi-copper)" stroke-width="2.5"/>
  <circle cx="50" cy="11" r="3.2" fill="#38bdf8"/>

  <!-- Sol Alt Düğüm (Çırak / Bağımlılık 1) -->
  <circle cx="15" cy="87" r="7.5" fill="#040b14" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="15" cy="87" r="2.8" fill="url(#ahi-gold)"/>

  <!-- Sağ Alt Düğüm (Kalfa / Bağımlılık 2) -->
  <circle cx="85" cy="87" r="7.5" fill="#040b14" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="85" cy="87" r="2.8" fill="url(#ahi-gold)"/>
</svg>
